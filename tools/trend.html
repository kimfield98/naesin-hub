<!DOCTYPE html>
<!--
  에이닷 영어학원 세종아름지점 · 내신 경향분석지 템플릿 v3.12
  (v3.12 · 2026.10.30: 변형률 계산을 심화분석지 v3.13과 같게 — 짧은 원문 조각 보완 + 강사가 고친 형광펜 반영)
  (v3.11 · 2026.10.29: 심화분석지 v3.12와 같은 화면 배치 — 위쪽 도구 줄 한 줄, 오른쪽 칸에 확인 패널 + '총평 쓰기'(한 줄 요약·등급컷·특징·대비법). 오른쪽 칸에 쓰면 왼쪽 분석지에 바로 반영)
  (v3.10 · 2026.10.28: 출처 분류 교과서·모의고사·부교재·유인물·쌩외부지문·미확인 · 심화분석지 v3.9와 짝, 예전 '외부지문'은 '쌩외부지문'으로 집계)
  (v3.9 · 2026.10.28: 조교 단계 삭제에 맞춰 '조교 확인 전' 경고 삭제 · 심화분석지 v3.7과 짝)
  (v3.8 · 2026.10.28: 객관식 정답 분포 삭제, 총평을 등급컷(1·2등급+한 줄 평)·특징·대비법(각각 요약/객관식/주관식)으로 개편)
  (v3.7 · 2026.10.28: 문항 지도 삭제, '강사 총평' → '총평', 총평에 등급컷(1~4등급 최저 점수) 칸 추가)
  (v3.6 · 2026.10.28 · 표본 디자인 적용: 상단 띠·요약 카드·번호 섹션·도넛 그래프 / 심화분석지 템플릿 v3.5와 짝으로 사용)
  (v3.5 · 2026.10.27: 심화분석지 v3.5 불러오기로 자동 채움)

  흐름
  1. [강사] 심화분석지 검수를 마치고 [저장] → '…_심화분석_검수완료.html'
  2. [강사] 이 파일을 브라우저로 열고 [심화분석지 불러오기] → 위 파일 선택 (화면에 끌어다 놓아도 됨)
     → 출처·유형·변형·난이도·킬러가 자동으로 채워집니다. 따로 AI 작업이 없습니다.
  3. [강사] '한 줄 요약'(자동 문장, 고쳐 써도 됨), 총평의 등급컷과 특징·대비법(요약 한 줄, 객관식, 주관식)을 씁니다. → [저장]
     → 다운로드 폴더에 '…_경향분석.html'이 생깁니다.
  4. [인쇄] 또는 Ctrl+P / Cmd+P → 설정 변경 없이 그대로 인쇄 (보통 2쪽, 양면 인쇄 기준)

  자동 계산(심화분석지와 같은 고정 공식, 사람이 고치지 않음)
  - 변형률: 심화분석지 v3.13의 형광펜 단어 수 ÷ 시험 지문 전체 단어 수 (강사가 고친 형광펜 반영, 심화분석지 화면 숫자와 같음)
  - 변형 정도: 없음 5% 미만 · 하 5~25% · 중 25~75% · 상 75% 이상
  - 숫자가 이상하면 이 파일이 아니라 심화분석지에서 고친 뒤 다시 불러옵니다.
  디자인·계산 코드는 수정하지 않습니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내신 경향분석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  /* ───────── 고정 디자인: 작업자는 이 부분을 수정하지 않습니다 ───────── */
  :root{ --navy:#1B2B4B; --blue:#2B5CA8; --ink:#1A2233; --sub:#5B6676; --faint:#8A93A1; --line:#D9DFE7; --card:#EEF3FA; --track:#E7ECF2;
         --c1:#2B5CA8; --c2:#1C2E52; --c3:#4A9A9B; --c4:#7FA9D8; --c5:#8E96C2; --c6:#BFC8D8; }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
  html,body{margin:0;background:#E6E9EE}
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);font-size:12.5px;line-height:1.5;word-break:keep-all}
  .sheet{width:794px;margin:24px auto;background:#fff;padding:0 46px}

  /* 매 쪽 반복되는 머리글·바닥글 */
  table.frame{width:100%;border-collapse:collapse}
  table.frame > thead td{padding:0}
  .topbar{height:0;border-top:6px solid var(--navy);margin:0 -46px}
  .run{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:12px 0 0;height:15mm}
  table.frame > tfoot td{height:14mm;vertical-align:bottom;padding:0 0 7mm}
  .foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:6px}

  /* 표지 */
  .cover h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--navy);line-height:1.25}
  .cover .sub{margin:4px 0 0;font-size:12.5px;color:var(--sub)}
  .cover .range{margin:2px 0 0;font-size:11px;color:var(--faint)}
  .cover .rule{height:0;border-top:1.5px solid var(--navy);margin-top:12px}

  /* 요약 카드 */
  .sum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid #E1E8F2;border-radius:8px;margin-top:14px;padding:11px 0}
  .sum > div{text-align:center;padding:0 10px}
  .sum > div + div{border-left:1px solid #CFD8E5}
  .sum .k{display:block;font-size:11.5px;color:var(--sub)}
  .sum .v{display:block;font-size:24px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:-.4px}
  .sum .s{display:block;font-size:11px;color:var(--sub)}
  .headline{margin:12px 0 0;font-size:14px;font-weight:700;color:var(--navy);outline:none;border-radius:3px}
  .headline:focus{box-shadow:0 0 0 2px #C9D7EC}

  /* 번호 섹션 */
  .sec{margin-top:18px;break-inside:avoid}
  .sh{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .sh .n{font-size:16px;font-weight:700;color:var(--blue)}
  .sh h2{margin:0;font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
  .sh small{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .sb{display:grid;grid-template-columns:168px 1fr;gap:32px;align-items:start;padding-top:10px}

  /* 도넛 */
  .donut{position:relative;width:168px;height:168px}
  .donut svg{display:block;width:168px;height:168px}
  .donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .donut .c .l{font-size:11px;color:var(--sub);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .donut .c .p{font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;letter-spacing:-.5px}
  .donut .c .r{font-size:10.5px;color:var(--sub)}

  /* 범례 표 */
  .lg{width:100%;border-collapse:collapse}
  .lg th{font-size:10.5px;font-weight:400;color:var(--faint);text-align:left;padding:0 0 6px}
  .lg th.r,.lg td.r{text-align:right}
  .lg td{font-size:12.5px;padding:4px 0;vertical-align:middle}
  .lg td.r{font-size:12px;color:var(--sub);white-space:nowrap}
  .lg td.pc{font-size:14.5px;font-weight:800;color:var(--navy);text-align:right;width:62px;white-space:nowrap}
  .sw{display:inline-block;width:0;height:0;border:5.5px solid;border-radius:2px;vertical-align:-1px;margin-right:12px}
  .det{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .det .dh{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:3px}
  .det .row{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--sub);line-height:1.6}
  .det .row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .det .row span:last-child{white-space:nowrap}
  .det .row b{color:var(--ink);font-weight:700}
  .note{font-size:10.5px;color:var(--faint);line-height:1.6}
  .chips{display:flex;flex-wrap:wrap;gap:4px 5px;margin-top:3px}
  .chip{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:10.5px;color:var(--sub);white-space:nowrap}
  .chip b{color:var(--blue)}
  .star{color:var(--navy);font-weight:800}

  /* 총평 */
  .cutband{display:grid;grid-template-columns:auto auto 1fr;align-items:center;background:var(--card);border:1px solid #E1E8F2;border-radius:8px;margin-top:12px;padding:10px 0}
  .cutband > div{padding:0 22px}
  .cutband > div + div{border-left:1px solid #CFD8E5}
  .cutband .lab{font-size:14px;font-weight:700;color:var(--navy)}
  .cutband .gs{display:flex;gap:30px;align-items:baseline}
  .cutband .g{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .cutband .g small{font-size:12px;color:var(--sub)}
  .cutv{display:inline-block;min-width:34px;text-align:center;font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;outline:none;border-bottom:1px dashed transparent}
  .cutv:focus{border-bottom-color:var(--blue)}
  .cutv:empty::before{content:"—";color:#B4BBC6;font-weight:400}
  .cutband .g .u{font-size:12px;color:var(--sub)}
  .cutnote{font-size:12.5px;color:var(--ink);outline:none;min-height:18px}
  .cutnote:empty::before{content:attr(data-ph);color:#A9B0BB}
  .rv{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
  .rbox{border:1px solid #DCE3EE;border-radius:8px;overflow:hidden;break-inside:avoid}
  .rbox .rh{background:var(--card);padding:8px 16px;font-size:14px;font-weight:700;color:var(--navy);border-bottom:1px solid #E6ECF4}
  .rbox .rb{padding:10px 16px 12px;background:#FAFBFE}
  .rbox .lead{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .rbox .lb{font-size:11.5px;font-weight:700;color:var(--blue);margin-top:8px}
  .ce{font-size:12px;line-height:1.65;min-height:20px;border:1px dashed var(--line);border-radius:4px;padding:3px 6px;outline:none;white-space:pre-line;text-align:justify}
  .ce.lead{min-height:0}
  .ce:focus{border-color:var(--blue);border-style:solid}
  .ce:empty::before{content:attr(data-ph);color:#A9B0BB;font-weight:400}
  .blank{display:none}
  .warnp{font-size:10.5px;color:#9A6A00;margin-top:8px}

  /* 화면 전용 */
  .toolbar{position:sticky;top:0;z-index:5;background:#1E3A5F;color:#fff;display:flex;align-items:center;gap:10px;padding:6px 16px;font-size:13px}
  .toolbar .p{margin-right:auto}
  .toolbar button{font:inherit;font-size:13px;border:1px solid #fff;background:transparent;color:#fff;border-radius:5px;padding:4px 12px;cursor:pointer}
  .toolbar button.main{background:#fff;color:#1E3A5F;font-weight:700}
  .toolbar button:disabled{opacity:.4;cursor:not-allowed}
  .panel{width:794px;margin:18px auto 0;background:#fff;border-radius:8px;padding:14px 18px;font-size:13px;border:1px solid var(--line)}
  .panel h2{margin:0 0 8px;font-size:14px;color:#1E3A5F}
  .panel h2 small{font-weight:400;color:var(--faint);margin-left:6px}
  .panel .saved{margin:0 0 8px;font-size:12px;color:var(--sub)} .panel .unsaved{color:#B42318;font-weight:700}
  .chk{display:grid;grid-template-columns:22px 1fr;gap:2px 6px;line-height:1.55}
  .chk .i{font-weight:800;text-align:center}
  .chk .ok{color:#1F7A4A} .chk .warn{color:#9A6A00} .chk .bad{color:#B42318} .chk .info{color:var(--faint)}
  .empty{padding:60px 0;text-align:center;color:var(--faint);font-size:14px;line-height:1.8}
  .drop{outline:3px dashed #F5C542;outline-offset:-10px}
  .edit-hint{font-size:10.5px;color:var(--faint);font-weight:400;margin-left:8px}

  @media print{
    html,body{background:#fff}
    .toolbar,.panel,.edit-hint,.side{display:none!important}
    .mainwrap{margin-right:0!important}
    .sheet{width:auto;margin:0;padding:0 13mm}
    .topbar{margin:0 -13mm}
    .ce{border:0;padding:0;min-height:0}
    .ce:empty{display:none}
    .cutv:empty::before,.cutnote:empty::before{content:''}
    .cutv:empty{min-width:46px;border-bottom:1px solid #9AA3AF;height:24px}
    .rbox .rb{background:#fff}
    .ce:empty + .blank{display:block}
    .blank i{display:block;height:7mm;border-bottom:1px dotted #9AA3AF}
  }
  @media screen and (max-width:860px){ .panel,.sheet{width:auto;margin-left:8px;margin-right:8px} .sb{grid-template-columns:1fr;justify-items:center} .sb > :last-child{width:100%} .rv{grid-template-columns:1fr} .cutband{grid-template-columns:1fr} .cutband > div + div{border-left:0;border-top:1px solid #CFD8E5;padding-top:8px;margin-top:8px} .topbar{margin:0 -46px} }

  /* ───────── v3.11 오른쪽 칸: 확인 패널 + 총평 쓰기 (화면 전용) ───────── */
  :root{ --sideW:380px; --tbH:41px; }
  .side{position:fixed;top:var(--tbH);right:0;bottom:0;width:var(--sideW);background:#F4F6F9;border-left:1px solid var(--line);overflow-y:auto;z-index:4;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
  body:not(.side-on) .side{display:none}
  body.side-on .mainwrap{margin-right:var(--sideW)}
  .side .panel{width:auto;margin:0;padding:12px 14px}
  .toolbar #btnSide{border-style:dashed}
  .toolbar button{white-space:nowrap;flex:none}
  .toolbar .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wform{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .wform h2{margin:0;font-size:14px;color:#1E3A5F} .wform h2 small{font-weight:400;color:var(--faint);margin-left:6px;font-size:11.5px}
  .wform h3{margin:4px 0 0;font-size:13px;color:#1E3A5F;border-top:1px solid #E3E8EE;padding-top:10px}
  .wf{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--sub)}
  .wf input,.wf textarea{font:inherit;font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 7px;background:#fff;width:100%;resize:vertical;line-height:1.55}
  .wf input:focus,.wf textarea:focus{outline:2px solid #1E3A5F;outline-offset:-1px}
  .wcut{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wf .auto{align-self:flex-start;font:inherit;font-size:11.5px;border:0;background:none;color:#1E3A5F;text-decoration:underline;padding:0;cursor:pointer}
  .wnote{margin:0;font-size:11.5px;color:var(--faint);line-height:1.5}
  .flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 4px #F5C542}100%{box-shadow:0 0 0 4px transparent}}
  @media (max-width:1200px){ body.side-on .mainwrap{margin-right:0} .side{box-shadow:-8px 0 20px rgba(20,30,45,.18)} }
  @media (max-width:860px){ :root{ --sideW:100vw; } }
</style>
</head>
<body>


<div class="toolbar">
  <span class="p" id="progress"></span>
  <button type="button" id="btnLoad">심화분석지 불러오기</button><input type="file" id="fileIn" accept=".html,.htm,.json" hidden>
  <button type="button" id="btnSave">저장</button>
  <button type="button" class="main" id="btnPrint">인쇄</button>
  <button type="button" id="btnSide">오른쪽 칸 닫기</button>
</div>
<aside class="side" id="side"><div class="panel" id="panel"></div><div id="wform"></div></aside>

<div class="mainwrap"><div class="sheet"><div id="app"></div></div></div>

<!-- 데이터: 직접 고치지 않습니다. [심화분석지 불러오기]와 [저장]으로만 바뀝니다. -->
<script type="application/json" id="data">
{
 "meta": {
  "academy": "에이닷 영어학원 세종아름지점"
 },
 "groups": {},
 "items": []
}
</script>
<script>
(function(){
  /* ── 고정 목록·기준: 심화분석지 v3.5와 같음, 수정 금지 ── */
  const CATS  = ["교과서","모의고사","부교재","유인물","쌩외부지문","미확인"];
  const LEVEL = r => r==null ? null : r<5 ? '없음' : r<25 ? '하' : r<75 ? '중' : '상';
  const LV_CLASS = {'없음':'lv0','하':'lv1','중':'lv2','상':'lv3'};

  let D = JSON.parse(document.getElementById('data').textContent);
  let dirty = false;
  const app = document.getElementById('app');
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const isSubj = no => /^서[답술]/.test(no);
  const qLabel = no => isSubj(no) ? `서답형 ${String(no).replace(/^서[답술]형?\s*/,'')}` : `${no}번`;
  const qShort = no => isSubj(no) ? `서${String(no).replace(/^서[답술]형?\s*/,'')}` : String(no);
  const r1 = x => Math.round(x*10)/10;

  /* ── 변형률·형광펜 계산 v2 (심화분석지 v3.13 · 경향분석지 v3.12 공통 고정 공식, 수정 금지) ──────────
     ① 3단어 규칙: 시험 지문의 단어를 포함한 연속 3단어가 원문에 그대로 있으면 '원문 단어'.
     ② 짧은 원문 조각 보완: 원문과 시험지를 단어 순서대로 맞춰 본 뒤(최장 공통 부분열),
        바뀐 단어 사이에 낀 1~2단어 원문 조각도 '원문 단어'로 본다.
        조건: 조각 앞뒤의 바뀐 부분이 각각 3단어 이하이고, 한쪽이 지문 끝이거나 ①로 확인된 원문 단어에 붙어 있을 것.
     ③ 강사 조정: 강사가 형광펜을 추가(+)·삭제(-)·자동으로 되돌리기(0)한 단어는 그 결과를 따른다 (나중에 한 것이 우선).
     형광펜 = ①②로 찾은 새 단어 + ③ 조정.  변형률 = 형광펜 단어 수 ÷ 시험 지문 전체 단어 수.
     (A)·ⓐ·① 같은 기호와 빈칸 밑줄은 세지 않는다.                                                            */
  const WORD = /[A-Za-z]+(?:['’][A-Za-z]+)*/g;
  const blankLabels = s => String(s||'').replace(/\(\s*[A-Ea-e]\s*\)/g, m => ' '.repeat(m.length));
  function toks(s){ const out=[]; let m; const c = blankLabels(s); WORD.lastIndex=0;
    while((m=WORD.exec(c))) out.push({w:m[0].toLowerCase().replace(/’/g,"'"), a:m.index, b:m.index+m[0].length});
    return out; }
  function grams(t){ const g=new Set(); for(let i=0;i+2<t.length;i++) g.add(t[i].w+' '+t[i+1].w+' '+t[i+2].w); return g; }
  function cover(t, g){ return t.map((_,i)=>{ for(let k=i-2;k<=i;k++){ if(k<0||k+2>=t.length) continue;
      if(g.has(t[k].w+' '+t[k+1].w+' '+t[k+2].w)) return true; } return false; }); }
  const GAP = 3;
  const lcsMemo = new Map();
  function lcsPairs(te, to){
    const key = te.map(t=>t.w).join(' ') + '\u0000' + to.map(t=>t.w).join(' ');
    if(lcsMemo.has(key)) return lcsMemo.get(key);
    const n = te.length, m = to.length, W = m+1, L = new Uint16Array((n+1)*W);
    for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
      L[i*W+j] = te[i].w===to[j].w ? L[(i+1)*W+j+1]+1 : Math.max(L[(i+1)*W+j], L[i*W+j+1]);

    while(i<n && j<m){

      else if(L[(i+1)*W+j] >= L[i*W+j+1]) i++; else j++; }

  function shortFill(te, to, cov){

      if(b && b.e===i && b.oe===j){ b.e++; b.oe++; } else B.push({s:i, e:i+1, os:j, oe:j+1}); });
    B.forEach((b,k) => {
      if(b.e-b.s > 2) return;                                   // 3단어 이상은 ①에서 이미 확인됨
      let all = true; for(let x=b.s;x<b.e;x++) if(!cov[x]) all = false; if(all) return;

      if(P && gL>0 && b.os-P.oe > gL+GAP) return;               // 원문 쪽도 비슷한 길이가 바뀐 자리여야 함

  /* 표시 기호([[ ]], ** **, n|)를 뺀 글자와 원래 위치 */
  function plainMap(s){ const plain=[], map=[]; let i=0;
    while(i<s.length){
      if(s.startsWith('[[',i)||s.startsWith(']]',i)){ i+=2; continue; }
      if(s.startsWith('**',i)){ const opening = (s.slice(0,i).match(/\*\*/g)||[]).length%2===0; i+=2; const m = s.slice(i).match(/^([\w가-힣]+)\|/); if(opening && m) i+=m[0].length; continue; }

  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const normWS = x => String(x||'').replace(/\s+/g,' ').trim();
  /* 지문의 줄(빈 줄 제외) 위치: n번째 줄 = 화면의 n번째 문장 줄 */
  function lineSpans(s){ const out=[]; let pos=0;
    String(s).split('\n').forEach(raw => { const t = raw.trim(); if(t){ const a = pos + raw.indexOf(t); out.push({a, b:a+t.length}); } pos += raw.length+1; });
    return out; }
  /* 강사 조정 하나({op,t,ln,at}) → 지문 글자 범위. 같은 줄에서 at에 가장 가까운 같은 글자를 찾음 (지문을 고쳐 못 찾으면 무시) */
  function opRange(s, L, o){

      if(!best || Math.abs(m.index-(o.at||0)) < Math.abs(best.i-(o.at||0))) best = {i:m.index, n:m[0].length}; }
    return best ? [ln.a + pm.map[best.i], ln.a + pm.map[best.i+best.n-1] + 1] : null; }
  /* v3.10~3.12에서 추가한 형광펜(문자열): 지문 전체에서 같은 글자를 모두 찾음 */
  function legacyRanges(s, list){ const out = [], {plain, map} = plainMap(s);
    (list||[]).forEach(ph => { const q = String(ph).trim(); if(!q) return; const re = new RegExp(reEsc(q).replace(/\s+/g,'\\s+'),'g'); let m;
      while((m=re.exec(plain))){ if(!m[0].length){ re.lastIndex++; continue; } out.push([map[m.index], map[m.index+m[0].length-1]+1]); } });
    return out; }
  /* st: 단어마다 0 원문 · 1 자동 형광펜 · 2 강사가 추가 · 3 강사가 지움(자동 형광펜이었던 단어)
     force = 원문이 없어도 강사 조정만으로 표시(보기 상자 등) */
  function analyze(exam, orig, adj, force){
    const noOrig = !orig || !String(orig).trim();

    const s = String(exam), te = toks(s), to = noOrig ? [] : toks(orig);
    if(te.length<3 && !force) return null;
    const cov = noOrig ? te.map(()=>true) : cover(te, grams(to)), f = noOrig ? {ext:cov, usedO:new Set()} : shortFill(te, to, cov);
    const auto = f.ext.map(c=>!c), st = auto.map(x=>x?1:0);
    const put = (r, op) => { if(!r) return; te.forEach((t,k) => { if(t.a<r[1] && t.b>r[0]) st[k] = op==='+' ? 2 : op==='-' ? (auto[k]?3:0) : (auto[k]?1:0); }); };
    if(adj){ legacyRanges(s, adj.legacy).forEach(r=>put(r,'+')); const L = lineSpans(s); (adj.ops||[]).forEach(o=>put(opRange(s,L,o), o.op)); }
    const newN = st.filter(v=>v===1||v===2).length;
    return { rate: te.length ? Math.round(newN/te.length*100) : 0, te, to, st, adjusted: st.some(v=>v>=2),

  }
  /* 문항의 강사 조정: 문항 전용 지문이면 문항에, 공유 지문이면 묶음(groups)에 저장됨 */
  const adjOf = (o, f) => o ? {legacy: (o.hl||{})[f]||[], ops: (o.hlOps||{})[f]||[]} : null;
  function passAdj(it){ if(it.passage) return adjOf(it,'passage'); const g = it.group && D.groups ? D.groups[it.group] : null; return adjOf(g,'passage'); }
  function origOf(it){ const g = it.group && D.groups ? D.groups[it.group] : null; return it.original || (g && g.original) || ''; }
  function examOf(it){ const g = it.group && D.groups ? D.groups[it.group] : null; return it.passage || (g && g.passage) || ''; }
  function varOf(it){ const a = analyze(examOf(it), origOf(it), passAdj(it)); return a ? {rate:a.rate, level:LEVEL(a.rate)} : null; }

  /* ── 출처 세부: 출처 상세 글에서 단원만 뽑음 ── */
  function unitOf(s){ const d = String(s.detail||''); let m;
    if(s.cat==='교과서'){ if((m=d.match(/(\d+)\s*과/))) return m[1]+'과'; if((m=d.match(/lesson\s*(\d+)/i))) return 'Lesson '+(+m[1]); }
    if(s.cat==='부교재'){ if((m=d.match(/unit\s*(\d+)/i))) return 'UNIT '+(+m[1]); if((m=d.match(/(\d+)\s*강/))) return m[1]+'강'; }
    if(s.cat==='모의고사'){ if((m=d.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/))) return m[1].slice(2)+'년 '+(+m[2])+'월'; }
    return ''; }
  function bookOf(s){ const d = String(s.detail||''); let m;

    if(s.cat==='교과서' && (m=d.match(/^(.*?)\s*(\d+\s*과|lesson\s*\d+)/i))) return m[1].trim();
    return ''; }
  function srcShort(r){ const u = r.unit;
    if(r.cat==='모의고사') return '모의 '+(u ? u.replace(/^(\d+)년 (\d+)월$/,'$1.$2') : '');
    if(r.cat==='부교재') return '부교 '+u.replace(/^UNIT /,'U');
    if(r.cat==='교과서') return '교과 '+u;
    if(r.cat==='쌩외부지문') return '쌩외부';
    if(r.cat==='유인물') return '유인물';

  /* ── 집계 ── */
  function rowsOf(){
    return (D.items||[]).filter(it=>it.stem||it.type).map(it=>{
      const s = it.source||{}, e = it.eval||{};
      return { it, no:String(it.no), pts:Number(it.points)||0, type:it.type||'미분류', cat:s.cat==='외부지문'?'쌩외부지문':CATS.includes(s.cat)?s.cat:'미확인',
        unit:unitOf(s), book:bookOf(s), v:varOf(it), diff:e.difficulty||'', killer:!!e.killer, done:e.status==='done',

  }
  function agg(rows, key){ const m = new Map();

    return [...m.values()].sort((a,b)=> b.n-a.n || b.pts-a.pts); }
  const avgRate = rows => { const v = rows.filter(r=>r.v); return v.length ? Math.round(v.reduce((s,r)=>s+r.v.rate,0)/v.length) : null; };
  const top = list => { if(!list.length) return null; const t = list.filter(o=>o.n===list[0].n && r1(o.pts)===r1(list[0].pts)); return t; };

  const PAL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];

  /* 도넛: 배경 그래픽 설정과 관계없이 인쇄되도록 SVG 선으로 그림 */

  }
  const sec = (n, title, note, body) => `<section class="sec"><div class="sh"><span class="n">${n} /</span><h2>${title}</h2><small>${esc(note)}</small></div>${body}</section>`;
  const lgRow = (color, name, mid, pc) => `<tr><td><i class="sw" style="border-color:${color}"></i>${name}</td><td class="r">${mid}</td><td class="pc">${pc}</td></tr>`;
  const lgHead = (a,b,c) => `<tr><th style="padding-left:23px">${a}</th><th class="r">${b}</th><th class="r">${c}</th></tr>`;

  /* ── 화면 그리기 ── */
  function render(){

          lines.push(`<div class="row"><span>${esc(o.k)}${b.k?' · '+esc(b.k):''} · ${esc(u.k)}</span><span>${u.n}문항 · ${r1(u.pts)}점</span></div>`); });
      });

    byCat.filter(o=>['유인물','쌩외부지문','미확인'].includes(o.k)).forEach(o=> srcDet.push(`<div class="row"><span>${esc(o.k)}</span><span>${o.n}문항 · ${r1(o.pts)}점</span></div>`));
    const s01 = sec('01','출제 출처 구성',`전체 ${N}문항 기준`, `<div class="sb">
      ${donut(catParts, N, {l:tc[0].k, p:pctS(tc[0].n,N), r:`${tc[0].n} / ${N}문항`})}

        ${catParts.map(o=>lgRow(o.color, esc(o.k), `${o.n}문항 · ${r1(o.pts)}점`, pctS(o.n,N))).join('')}</table>

    /* 02 문제 유형 */
    const TOPN = 5, typeParts = byType.slice(0,TOPN).map((o,i)=>({...o, color:PAL[i]}));
    const rest = byType.slice(TOPN);
    if(rest.length) typeParts.push({k:`그 외 ${rest.length}가지`, n:rest.reduce((s,o)=>s+o.n,0), pts:rest.reduce((s,o)=>s+o.pts,0), color:PAL[5]});
    const subjTypes = agg(subj, r=>r.type);
    const s02 = sec('02','문제 유형',`유형 ${byType.length}가지 · 전체 ${N}문항 기준`, `<div class="sb">
      ${donut(typeParts, N, {l:byType[0].k, p:pctS(byType[0].n,N), r:`${byType[0].n} / ${N}문항`})}
      <div><table class="lg">${lgHead('유형','문항 수 · 배점','비율')}
        ${typeParts.map(o=>lgRow(o.color, esc(o.k), `${o.n}문항 · ${r1(o.pts)}점`, pctS(o.n,N))).join('')}</table>
        ${(rest.length||subj.length)?`<div class="det">
          ${rest.length?`<div class="row"><span>그 외: ${rest.map(o=>`${esc(o.k)} ${o.n}`).join(' · ')}</span><span></span></div>`:''}
          ${subj.length?`<div class="row"><span>서답형 ${subj.length}문항: ${subjTypes.map(o=>`${esc(o.k)} ${o.n}`).join(' · ')}</span><span>${sumPts(subj)}점</span></div>`:''}</div>`:''}</div></div>`);

    const lvs = ['상','중','하','없음'].map(L=>({k:L, rs:rows.filter(r=>r.v && r.v.level===L)})).map(o=>({...o, n:o.rs.length, pts:sumPts(o.rs), color:LV_COLOR[o.k]}));

    const noV = rows.filter(r=>!r.v), big = rows.filter(r=>r.v && r.v.level==='상');

    const s03 = sec('03','변형 정도',`원문과 비교한 ${withV.length}문항 기준`, `<div class="sb">
      ${donut(lvs, withV.length, {l:'평균 변형률', p:avg==null?'—':avg+'%', r:avg==null?'원문 없음':`변형 ${LEVEL(avg)}`})}
      <div><table class="lg">${lgHead('변형 정도','문항 수 · 배점','비율')}
        ${lvs.map(o=>lgRow(o.color, lvName[o.k], `${o.n}문항 · ${o.pts}점`, pctS(o.n, withV.length))).join('')}</table>
        <div class="det"><div class="dh">자주 쓴 변형 방식</div>
          <div class="chips">${meth.slice(0,8).map(o=>`<span class="chip">${esc(o.k)} <b>${o.n}</b></span>`).join('')||'<span class="note">—</span>'}</div>
          ${big.length?`<div class="note" style="margin-top:5px">변형 '상' 문항: ${esc(big.map(r=>qShort(r.no)).join(', '))}</div>`:''}
          ${noV.length?`<div class="note">원문 없음(변형률 계산 안 됨): ${esc(noV.map(r=>qShort(r.no)).join(', '))}</div>`:''}</div></div></div>`);

    /* 04 난이도 · 킬러 */
    const dfs = ['상','중','하'].map(d=>({k:d, rs:rows.filter(r=>r.diff===d)})).map(o=>({...o, n:o.rs.length, pts:sumPts(o.rs), color:DF_COLOR[o.k]}));
    const s04 = sec('04','난이도 · 킬러',`전체 ${N}문항 기준`, `<div class="sb">
      ${donut(dfs, N, {l:'고난도(상)', p:`${dfs[0].n}문항`, r:`${dfs[0].pts}점 · 배점의 ${pctOf(dfs[0].pts)}%`})}
      <div><table class="lg">${lgHead('난이도','문항 수 · 배점','비율')}
        ${dfs.map(o=>lgRow(o.color, o.k, `${o.n}문항 · ${o.pts}점`, pctS(o.n,N))).join('')}</table>
        <div class="det"><div class="dh">킬러 ${killers.length}문항</div>
          ${killers.length ? killers.map(r=>`<div class="row"><span><span class="star">★</span> ${esc(qLabel(r.no))} · ${esc(r.type)} · ${esc(srcShort(r))}</span><span>${r.pts}점${r.v?' · 변형 '+r.v.rate+'%':''}</span></div>`).join('') : '<div class="note">킬러 문항 없음</div>'}</div></div></div>`);

    /* 05 총평: 등급컷 · 특징 · 대비법 */
    const ed = (k, ph, cls='') => `<div class="ce ${cls}" contenteditable="true" data-k="${k}" data-ph="${esc(ph)}">${esc(T[k]||'')}</div><div class="blank">${cls==='lead'?'<i></i>':'<i></i><i></i>'}</div>`;
    const part = (label, k, ph) => `<div class="lb">${label}</div>${ed(k, ph)}`;
    const rbox = (title, pre, ph) => `<div class="rbox"><div class="rh">${title}</div><div class="rb">
        ${ed(pre+'Lead', ph.lead, 'lead')}
        ${part('객관식', pre+'Obj', ph.obj)}
        ${subj.length?part('주관식', pre+'Subj', ph.subj):''}</div></div>`;
    const s05 = sec('05','총평', m.reviewer?`검수 ${m.reviewer}`:'', `
      <div class="cutband">
        <div class="lab">등급컷</div>
        <div class="gs">${[1,2].map(i=>`<span class="g"><small>${i}등급</small><span class="cutv" contenteditable="true" data-k="cut${i}">${esc(T['cut'+i]||'')}</span><span class="u">점</span></span>`).join('')}</div>
        <div><div class="cutnote" contenteditable="true" data-k="cutNote" data-ph="예: 전반적으로 어려운 시험이었습니다.">${esc(T.cutNote||'')}</div></div>
      </div>
      <div class="rv">
        ${rbox('특징','feat',{lead:'예: 지문 변형이 매우 많았던 시험입니다.', obj:'예: 원문 암기보다 바뀐 지문의 이해가 중요했습니다. 글의 흐름과 핵심을 정확히 파악해야 했습니다.', subj:'예: 본문 빈칸·요약문 완성은 6문항으로, 단어 형태·철자가 중요합니다. 2번은 부분점수가 없고, 9번은 답안 기호를 반드시 써야 합니다.'})}
        ${rbox('대비법','prep',{lead:'예: 원문 이해와 변형 지문 연습이 필요합니다.', obj:'예: 원문과 변형 지문을 비교하며 달라진 내용을 확인해야 합니다. 바뀐 지문을 기준으로 글의 흐름과 핵심을 파악하고, 선택지의 근거를 찾는 연습이 필요합니다.', subj:'예: 핵심 단어를 문장 속 빈칸에 직접 쓰며 단어 형태·철자를 확인해야 합니다. 부분점수 유무와 기호 등 답안 조건도 함께 점검해야 합니다.'})}
      </div>
      ${draft?`<p class="warnp">※ 강사 검수 전(AI 초안) 문항 ${draft}개가 포함된 자료입니다.</p>`:''}`);

    app.innerHTML = `
      <table class="frame">
        <thead><tr><td><div class="topbar"></div><div class="run"><span>${esc(m.school)} ${esc(m.grade)} · ${esc(m.academy)}</span><span>${esc(m.exam)}</span></div></td></tr></thead>
        <tfoot><tr><td><div class="foot"><span>${esc(m.date||'')} · 내신 경향분석</span><span>${esc(m.school)} ${esc(m.grade)} ${esc(m.exam)}</span></div></td></tr></tfoot>
        <tbody><tr><td>
          <section class="cover">
            <h1>내신 경향분석</h1>
            <p class="sub">출제 출처와 문제 유형을 한눈에 보는 시험 분석${m.reviewer?` · 검수 ${esc(m.reviewer)}`:''}</p>
            ${m.range?`<p class="range">시험범위 · ${esc(m.range)}</p>`:''}
            <div class="rule"></div>
          </section>
          ${sumCard}
          ${s01}${s02}${s03}${s04}${s05}
        </td></tr></tbody>
      </table>`;
    buildForm(subj.length>0, auto);
  }

  /* ── v3.11 총평 쓰기 (오른쪽 칸): 쓰는 대로 왼쪽 분석지에 반영 ── */
  let formFor = null, tmr = null;
  const FIELDS = (hasSubj) => [
    ['h','한 줄 요약','요약 카드 아래 굵은 한 줄'],
    ['headline','한 줄 요약','', 'input'],
    ['h','등급컷','성적이 나오면 적기 · 비우면 인쇄본에 빈칸'],
    ['cut','',''],
    ['cutNote','등급컷 한 줄 평','예: 전반적으로 어려운 시험이었습니다.','input'],
    ['h','특징',''],
    ['featLead','요약 한 줄','예: 지문 변형이 매우 많았던 시험입니다.','input'],
    ['featObj','객관식','예: 원문 암기보다 바뀐 지문의 이해가 중요했습니다.','ta'],
    ...(hasSubj?[['featSubj','주관식','예: 단어 형태·철자, 부분점수 유무, 답안 조건','ta']]:[]),
    ['h','대비법',''],
    ['prepLead','요약 한 줄','예: 원문 이해와 변형 지문 연습이 필요합니다.','input'],
    ['prepObj','객관식','예: 원문과 변형 지문을 비교하며 달라진 내용을 확인해야 합니다.','ta'],
    ...(hasSubj?[['prepSubj','주관식','예: 핵심 단어를 직접 쓰며 형태·철자를 확인해야 합니다.','ta']]:[])
  ];
  function buildForm(hasSubj, auto){
    const key = examKey(D)+'|'+hasSubj;
    if(formFor===key){ syncForm(auto); return; }
    formFor = key; const T = D.meta.trend||{};
    const f = (k, label, ph, kind) => `<label class="wf"><span>${label}</span>${kind==='ta'
      ? `<textarea data-w="${k}" rows="4" placeholder="${esc(ph)}">${esc(T[k]||'')}</textarea>`
      : `<input data-w="${k}" value="${esc(T[k]||'')}" placeholder="${esc(ph)}">`}</label>`;
    let h = `<div class="wform"><h2>총평 쓰기<small>쓰는 대로 왼쪽 분석지에 반영 · 저장은 위쪽 [저장]</small></h2>`;
    FIELDS(hasSubj).forEach(([k,label,ph,kind]) => {
      if(k==='h'){ h += `<h3>${label}${ph?` <small style="font-weight:400;color:var(--faint);font-size:11px">${esc(ph)}</small>`:''}</h3>`; return; }
      if(k==='cut'){ h += `<div class="wcut">${[1,2].map(i=>`<label class="wf"><span>${i}등급 (점)</span><input data-w="cut${i}" inputmode="decimal" value="${esc(T['cut'+i]||'')}" placeholder="예: ${i===1?'92':'84'}"></label>`).join('')}</div>`; return; }
      if(k==='headline'){ h += `<label class="wf"><span>비우면 자동 문장</span><input data-w="headline" value="${esc(T.headline||'')}" placeholder="${esc(auto)}"></label>`; return; }
      h += f(k, label, ph, kind); });
    h += `<p class="wnote">왼쪽 분석지의 칸을 눌러 직접 써도 됩니다. 비운 칸은 인쇄본에 손글씨 줄로 나옵니다.</p></div>`;
    $('wform').innerHTML = h;
  }
  function syncForm(auto){ const T = D.meta.trend||{};
    $('wform').querySelectorAll('[data-w]').forEach(el => { if(el===document.activeElement) return; el.value = T[el.dataset.w]||''; if(el.dataset.w==='headline') el.placeholder = auto; }); }
  const normW = (k, t) => { t = String(t||'');
    if(k==='headline' || k==='cutNote' || /Lead$/.test(k)) t = t.replace(/\s*\n\s*/g,' ');
    if(/^cut\d$/.test(k)) t = t.replace(/\s+/g,'').replace(/점(이상)?$/,'');
    return t.replace(/\n{3,}/g,'\n\n'); };
  $('wform').addEventListener('input', ev => { const k = ev.target.dataset.w; if(!k) return;
    const T = D.meta.trend = D.meta.trend||{}; T[k] = normW(k, ev.target.value); dirty = true;
    clearTimeout(tmr); tmr = setTimeout(()=>{ const y = window.scrollY; render(); window.scrollTo(0,y); }, 250); });
  $('wform').addEventListener('change', ev => { const k = ev.target.dataset.w; if(!k) return; const T = D.meta.trend||{}; T[k] = (T[k]||'').trim(); });
  /* 칸에 들어가면 왼쪽 분석지의 같은 자리로 이동 */
  $('wform').addEventListener('focusin', ev => { const k = ev.target.dataset.w; if(!k) return;
    const el = app.querySelector(`[data-k="${k}"]`); if(!el) return;
    const r = el.getBoundingClientRect(); if(r.top < 60 || r.bottom > window.innerHeight-20) el.scrollIntoView({behavior:'smooth', block:'center'});
    const box = el.closest('.rbox,.cutband') || el; box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); });

  /* 오른쪽 칸 열기·닫기 (넓은 화면은 기본으로 열림) */
  const SKEY = 'adot-trend-side';
  function setSide(on, remember){ document.body.classList.toggle('side-on', on); $('btnSide').textContent = on ? '오른쪽 칸 닫기' : '오른쪽 칸 열기';
    if(remember){ try{ localStorage.setItem(SKEY, on?'1':'0'); }catch(e){} } }
  $('btnSide').onclick = () => setSide(!document.body.classList.contains('side-on'), true);
  const tbH = () => document.documentElement.style.setProperty('--tbH', document.querySelector('.toolbar').offsetHeight+'px');
  window.addEventListener('resize', tbH);
  (()=>{ let pref = null; try{ pref = localStorage.getItem(SKEY); }catch(e){}
    setSide(pref==null ? window.innerWidth>=1200 : pref==='1'); tbH();
    if(pref==null) window.addEventListener('resize', () => { let p2 = null; try{ p2 = localStorage.getItem(SKEY); }catch(e){} if(p2==null) setSide(window.innerWidth>=1200); }); })();


  /* ── 확인 패널 (화면 전용) ── */
  function panel(rows){
    const m = D.meta||{}, L = [];
    if(rows.length){
      const pts = r1(rows.reduce((s,r)=>s+r.pts,0));
      L.push([Math.abs(pts-100)<0.05?'ok':'warn', `문항 ${rows.length}개 · 배점 합계 ${pts}점${Math.abs(pts-100)<0.05?'':' → 심화분석지에서 배점·문항 누락 확인'}`]);
      const draft = rows.filter(r=>!r.done);
      if(draft.length) L.push(['warn', `강사 검수 전 ${draft.length}문항: ${draft.map(r=>qShort(r.no)).join(', ')} → 난이도·킬러가 AI 초안입니다. 인쇄본에도 표시됩니다`]);
      const ans = rows.filter(r=>r.it.answerCheck && r.it.answerCheck.result && r.it.answerCheck.result!=='일치' && !r.it.answerCheck.decision);
      if(ans.length) L.push(['warn', `정답 확인이 끝나지 않은 문항: ${ans.map(r=>qShort(r.no)).join(', ')} → 심화분석지에서 [정답 확인]`]);
      const unk = rows.filter(r=>r.cat==='미확인' || (r.it.source&&r.it.source.status==='자료상 미확인'));
      if(unk.length) L.push(['warn', `출처 미확인: ${unk.map(r=>qShort(r.no)).join(', ')} → 경향분석에 '미확인'으로 집계됩니다`]);
      const noU = rows.filter(r=>['교과서','부교재','모의고사'].includes(r.cat) && !r.unit);
      if(noU.length) L.push(['info', `출처 상세에서 단원·회차를 못 읽은 문항: ${noU.map(r=>qShort(r.no)).join(', ')} → '기타'로 묶입니다 (예: '1과', 'UNIT 14', '2026년 9월'처럼 적으면 읽힘)`]);
      const noV = rows.filter(r=>!r.v);
      if(noV.length) L.push(['info', `원문이 없어 변형률을 계산하지 않은 문항: ${noV.map(r=>qShort(r.no)).join(', ')}`]);
      const T = m.trend||{};
      const need = ['featLead','featObj','prepLead','prepObj'].concat(rows.some(r=>isSubj(r.no))?['featSubj','prepSubj']:[]);
      if(need.some(k=>!(T[k]||T[k==='featObj'?'overall':k==='prepObj'?'prep':'']||'').trim())) L.push(['warn','총평의 특징·대비법 칸을 채워 주세요 (비워 두면 인쇄본에 손글씨 줄이 나옵니다)']);
      if(![1,2].some(i=>(T['cut'+i]||'').trim())) L.push(['info','등급컷이 비어 있습니다 → 성적이 나오면 총평의 1·2등급 칸에 적거나, 인쇄본 빈칸에 직접 적습니다']);
      if(!L.filter(x=>x[0]==='bad'||x[0]==='warn').length) L.push(['ok','확인 항목 이상 없음 · 바로 인쇄할 수 있습니다']);
    }
    const icon = {ok:'✓',bad:'✕',warn:'!',info:'·'};
    $('panel').innerHTML = `<h2>확인 패널<small>화면에만 보이고 인쇄되지 않습니다</small></h2>
      ${m.srcFile?`<p class="saved">불러온 심화분석지: <b>${esc(m.srcFile)}</b>${m.savedAt?` (심화분석지 저장 ${esc(new Date(m.savedAt).toLocaleString())})`:''}</p>`:''}
      ${m.trendFile?`<p class="saved">마지막 저장 파일: <b>${esc(m.trendFile)}</b> (다운로드 폴더)${dirty?' · <span class="unsaved">저장 후 바뀐 내용 있음</span>':''}</p>`:''}
      ${L.length?`<div class="chk">${L.map(([l,t])=>`<span class="i ${l}">${icon[l]}</span><span>${esc(t)}</span>`).join('')}</div>`:'<p class="saved">심화분석지 파일을 불러오면 여기에서 확인할 점을 알려 줍니다.</p>'}`;
    return L.filter(x=>x[0]==='bad'||x[0]==='warn').length;
  }

  /* 총평 입력 */
  app.addEventListener('keydown', ev => { if(ev.key==='Enter' && ev.target.classList && (ev.target.classList.contains('cutv') || ev.target.classList.contains('cutnote') || ev.target.classList.contains('headline'))){ ev.preventDefault(); ev.target.blur(); } });
  app.addEventListener('focusout', ev => {
    const k = ev.target.dataset && ev.target.dataset.k; if(!k) return;
    let t = ev.target.innerText.replace(/\n{3,}/g,'\n\n').trim(); const T = D.meta.trend = D.meta.trend||{};
    if(k==='headline'){ t = t.replace(/\s*\n\s*/g,' '); if(t===ev.target.dataset.auto) t=''; }
    if(/^cut\d$/.test(k)) t = t.replace(/\s+/g,'').replace(/점(이상)?$/,'');
    if(k==='cutNote') t = t.replace(/\s*\n\s*/g,' ');
    if(t !== (T[k]||'')){ T[k] = t; dirty = true; const y = window.scrollY; render(); window.scrollTo(0,y); }
  });

  /* ── 불러오기: 심화분석지 저장 파일(HTML) 또는 JSON, 저장한 경향분석 파일도 가능 ── */
  const examKey = d => [d.meta&&d.meta.school, d.meta&&d.meta.grade, d.meta&&d.meta.exam].join('|');
  function readFile(f){
    if(!f) return; const r = new FileReader();
    r.onload = () => { try{
        let t = String(r.result), nd;
        if(/<html/i.test(t)){ const doc = new DOMParser().parseFromString(t,'text/html'), el = doc.getElementById('data'); if(!el) throw new Error('심화분석지 파일이 아닙니다'); nd = JSON.parse(el.textContent); }
        else nd = JSON.parse(t);
        if(!nd.meta || !Array.isArray(nd.items) || !nd.items.length) throw new Error('심화분석지 데이터가 없습니다');
        const same = D.items && D.items.length && examKey(D)===examKey(nd);
        if(D.items && D.items.length && !same && !confirm('지금 화면은 다른 시험입니다. 지우고 불러온 파일로 바꿀까요?')) return;
        const keepT = same && D.meta.trend && (D.meta.trend.overall||D.meta.trend.prep) ? D.meta.trend : null;
        D = nd; D.meta = D.meta||{};
        if(!D.meta.trend && keepT) D.meta.trend = keepT;
        if(!/경향분석/.test(f.name)) D.meta.srcFile = f.name;
        dirty = true; render();
      }catch(e){ alert('불러올 수 없습니다: ' + e.message); } };
    r.readAsText(f, 'utf-8');
  }
  $('btnLoad').onclick = () => $('fileIn').click();
  $('fileIn').onchange = ev => { readFile(ev.target.files[0]); ev.target.value=''; };
  document.addEventListener('dragover', ev => { ev.preventDefault(); document.body.classList.add('drop'); });
  document.addEventListener('dragleave', ev => { if(!ev.relatedTarget) document.body.classList.remove('drop'); });
  document.addEventListener('drop', ev => { ev.preventDefault(); document.body.classList.remove('drop'); readFile(ev.dataTransfer.files[0]); });

  /* ── 저장: 이 화면 그대로 새 HTML 파일로 내려받기 ── */
  $('btnPrint').onclick = () => { const a = document.activeElement; if(a && a.blur) a.blur(); setTimeout(()=>window.print(), 50); };
  $('btnSave').onclick = () => {
    const a = document.activeElement; if(a && a.blur) a.blur();
    const m = D.meta; m.trendSavedAt = new Date().toISOString();
    const name = [m.school,m.grade,m.exam].filter(Boolean).join('_').replace(/\s+/g,'_') + '_경향분석.html';
    m.trendFile = name;
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#app').innerHTML = ''; clone.querySelector('#panel').innerHTML = ''; clone.querySelector('#wform').innerHTML = '';
    clone.querySelector('body').classList.remove('side-on');
    clone.querySelector('body').classList.remove('drop');
    clone.querySelector('#data').textContent = '\n' + JSON.stringify(D, null, 1).replace(/<\//g,'<\\/') + '\n';
    const blob = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], {type:'text/html'});
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000); dirty = false; autosave(); render();
    alert(`저장했습니다: ${name}\n\n· 컴퓨터의 '다운로드' 폴더에 새로 생깁니다. 처음 연 템플릿 파일은 바뀌지 않습니다.\n· 다시 고칠 때는 이 파일을 더블클릭해 열면 됩니다.`);
  };

  /* ── 자동 보관: 같은 컴퓨터·같은 브라우저에서 창을 닫았다 다시 열 때 이어서 작업 ── */
  const AKEY = 'adot-trend-v3';
  function autosave(){ try{ if(!D.items || !D.items.length) return; const all = JSON.parse(localStorage.getItem(AKEY)||'{}');
      all[examKey(D)] = {at: new Date().toISOString(), data: D}; localStorage.setItem(AKEY, JSON.stringify(all)); }catch(e){} }
  function restoreOffer(){ try{
      const all = JSON.parse(localStorage.getItem(AKEY)||'{}'); let cand = null;
      if(D.items.length){ const c = all[examKey(D)]; if(c && (!D.meta.trendSavedAt || c.at > D.meta.trendSavedAt) && JSON.stringify(c.data)!==JSON.stringify(D)) cand = c; }
      else Object.values(all).forEach(c => { if(!cand || c.at > cand.at) cand = c; });
      if(cand && confirm(`이 컴퓨터에 자동 보관된 경향분석 작업이 있습니다.\n${[cand.data.meta.school,cand.data.meta.grade,cand.data.meta.exam].join(' ')} · ${new Date(cand.at).toLocaleString()}\n\n이어서 작업할까요?`)){ D = cand.data; dirty = true; }
    }catch(e){} }
  window.addEventListener('beforeunload', ev => { if(dirty){ ev.preventDefault(); ev.returnValue=''; } });

  D.items = D.items||[];
  restoreOffer();
  render();
})();
</script>
</body>
</html>
